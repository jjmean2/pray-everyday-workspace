openapi: 3.1.0
info:
  title: 쌓이는 기도 API
  version: 0.1.0
  description: |
    웹, 서버, 네이티브 앱이 함께 따르는 API 계약이다(architecture/ARCHITECTURE.md의 "API 계약").
    이 명세가 원본이고, API를 바꿀 때는 이 파일을 먼저 고친다. TypeScript 타입은 이 명세에서 생성한다.
    오류 응답은 모두 RFC 9457 Problem Details(application/problem+json)다. 모든 엔드포인트는 따로 적지 않은
    오류를 default 응답(Error)으로 선언한다.
servers:
  - url: http://localhost:3000
    description: 로컬 개발
tags:
  - name: health
  - name: auth
  - name: notes
  - name: tags
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: 서버와 DB 상태
      responses:
        '200':
          description: 서버가 동작 중이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: 현재 로그인한 사용자
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 지금 세션을 지우고 세션 쿠키를 비운다
      description: 로그인하지 않은 상태에서 불러도 204를 돌려준다.
      responses:
        '204':
          description: 로그아웃했다
        default:
          $ref: '#/components/responses/Error'
  /auth/dev/login:
    post:
      operationId: devLogin
      tags: [auth]
      summary: 개발용 로그인
      description: |
        로컬 개발과 자동 테스트 전용이다. 서버가 DEV_LOGIN=true일 때만 있고, 운영 환경에는 없다.
        표시 이름으로 로그인하고, 처음 쓰는 이름이면 사용자를 만든다. 세션 쿠키를 준다.
      x-dev-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          description: 로그인했다. 세션 쿠키가 Set-Cookie로 온다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Error'
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: 내 노트 목록 (기도한 시각의 역순)
      description: 삭제 표시된 노트는 빼고, 기도제목과 태그를 함께 담는다.
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          description: 앞 페이지의 nextCursor. 없으면 처음부터
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 노트 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    get:
      operationId: getNote
      tags: [notes]
      summary: 노트 하나
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 노트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveNote
      tags: [notes]
      summary: 노트를 기도제목과 함께 통째로 저장한다
      description: |
        없으면 만들고 있으면 바꾼다. ID는 클라이언트가 만들어서 같은 요청을 다시 보내도 결과가 같다.
        items에서 빠진 기도제목은 삭제 표시하고, 삭제 표시된 노트나 기도제목을 다시 보내면 되살린다.
        다른 사람의 노트는 404다. 기도제목 ID가 다른 노트의 것이면(다른 사람의 것이라도) 409다.
        정렬 키가 fractional-indexing 4의 기본 형식에 맞지 않으면 400이다.
        지운 태그는 비교에서도 빼므로, 읽은 그대로 다시 보내면 버전이 오르지 않는다.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: 저장한 노트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: 노트와 그 기도제목에 삭제 표시를 한다
      description: 이미 삭제 표시된 노트도 204다.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 삭제 표시했다
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: 내 태그 목록 (이름 순)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 태그 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagId'
    put:
      operationId: saveTag
      tags: [tags]
      summary: 태그를 만들거나 이름을 바꾼다
      description: 이름은 앞뒤 공백을 잘라 저장하고, 내 태그 안에서 대소문자를 무시하고 겹치지 않는다. 겹치면 409다. 지운 태그는 되살리지 않는다(같은 ID로 보내면 409).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
      responses:
        '200':
          description: 저장한 태그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: 태그에 삭제 표시를 한다
      description: 노트와 기도제목에 붙어 있던 이 태그는 읽을 때 빠진다. 이미 삭제 표시된 태그도 204다.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 삭제 표시했다
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: 로그인할 때 서버가 주는 세션 쿠키(HttpOnly)
  parameters:
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        # ID는 소문자로만 쓴다(서버와 클라이언트가 문자열로 비교한다)
        pattern: '^[0-9a-f-]+$'
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        # ID는 소문자로만 쓴다(서버와 클라이언트가 문자열로 비교한다)
        pattern: '^[0-9a-f-]+$'
  responses:
    NotFound:
      description: 없거나 내 것이 아니다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 다른 레코드와 충돌한다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error:
      description: 이 엔드포인트에 따로 적지 않은 모든 오류. 형식은 항상 Problem Details다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: 요청이 명세에 맞지 않는다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 로그인하지 않았거나 세션이 만료됐다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [up, down]
    CurrentUser:
      type: object
      required: [id, displayName, profileImageUrl]
      properties:
        id:
          type: string
          format: uuid
          # ID는 소문자로만 쓴다(서버와 클라이언트가 문자열로 비교한다)
          pattern: '^[0-9a-f-]+$'
        displayName:
          type: string
        profileImageUrl:
          type: [string, 'null']
          format: uri
    DevLoginRequest:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
    TagIds:
      description: 붙인 태그의 ID. 삭제 표시된 태그는 응답에서 빠진다
      type: array
      maxItems: 50
      uniqueItems: true
      items:
        type: string
        format: uuid
        # ID는 소문자로만 쓴다(서버와 클라이언트가 문자열로 비교한다)
        pattern: '^[0-9a-f-]+$'
    SortKey:
      description: 노트 안의 순서를 정하는 분수 인덱스. fractional-indexing 4의 기본 형식이어야 하고(아니면 400), 바이트 순서로 정렬한다
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[0-9A-Za-z]+$'
    PrayerItemInput:
      type: object
      required: [id, sortKey, title, detail, tagIds]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          # ID는 소문자로만 쓴다(서버와 클라이언트가 문자열로 비교한다)
          pattern: '^[0-9a-f-]+$'
        sortKey:
          $ref: '#/components/schemas/SortKey'
        title:
          type: [string, 'null']
          maxLength: 200
        detail:
          type: [string, 'null']
          maxLength: 10000
        tagIds:
          $ref: '#/components/schemas/TagIds'
      description: 기도제목 하나. 제목과 상세 중 하나 이상은 공백이 아닌 글자를 가진다
      allOf:
        - anyOf:
            - properties:
                title:
                  type: string
                  pattern: '\S'
            - properties:
                detail:
                  type: string
                  pattern: '\S'
    NoteInput:
      type: object
      required: [prayedAt, memo, tagIds, items]
      additionalProperties: false
      properties:
        prayedAt:
          type: string
          format: date-time
        memo:
          type: [string, 'null']
          maxLength: 10000
        tagIds:
          $ref: '#/components/schemas/TagIds'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PrayerItemInput'
    PrayerItem:
      type: object
      required:
        [id, sortKey, title, detail, tagIds, threadId, version, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          # ID는 소문자로만 쓴다(서버와 클라이언트가 문자열로 비교한다)
          pattern: '^[0-9a-f-]+$'
        sortKey:
          $ref: '#/components/schemas/SortKey'
        title:
          type: [string, 'null']
        detail:
          type: [string, 'null']
        tagIds:
          $ref: '#/components/schemas/TagIds'
        threadId:
          type: [string, 'null']
          format: uuid
          # ID는 소문자로만 쓴다(서버와 클라이언트가 문자열로 비교한다)
          pattern: '^[0-9a-f-]+$'
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
    Note:
      type: object
      required:
        [id, prayedAt, memo, tagIds, items, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          # ID는 소문자로만 쓴다(서버와 클라이언트가 문자열로 비교한다)
          pattern: '^[0-9a-f-]+$'
        prayedAt:
          type: string
          format: date-time
        memo:
          type: [string, 'null']
        tagIds:
          $ref: '#/components/schemas/TagIds'
        items:
          description: 정렬 키 순서
          type: array
          items:
            $ref: '#/components/schemas/PrayerItem'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NoteList:
      type: object
      required: [notes, nextCursor]
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        nextCursor:
          description: 다음 페이지가 없으면 null
          type: [string, 'null']
    TagInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '\S'
    Tag:
      type: object
      required: [id, name, version, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          # ID는 소문자로만 쓴다(서버와 클라이언트가 문자열로 비교한다)
          pattern: '^[0-9a-f-]+$'
        name:
          type: string
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    Problem:
      description: RFC 9457 Problem Details
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: 문제의 종류를 가리키는 URI. 따로 정의하지 않은 문제는 about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
