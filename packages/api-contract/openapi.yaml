openapi: 3.1.0
info:
  title: 쌓이는 기도 API
  version: 0.1.0
  description: |
    웹, 서버, 네이티브 앱이 함께 따르는 API 계약이다(D-10). 이 명세가 원본이고,
    API를 바꿀 때는 이 파일을 먼저 고친다. TypeScript 타입은 이 명세에서 생성한다.
servers:
  - url: http://localhost:3000
    description: 로컬 개발
paths:
  /health:
    get:
      operationId: getHealth
      summary: 서버와 DB 상태
      responses:
        '200':
          description: 서버가 동작 중이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [up, down]
